<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="title desc">
  <title id="title">QuasarPunk</title>
  <desc id="desc">QuasarPunk, identidad tecnológica Maker independiente. Diseña. Construye. Comparte. Viedma, Río Negro, Argentina.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050a14"/>
      <stop offset="0.52" stop-color="#0b1a2d"/>
      <stop offset="1" stop-color="#06111b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.32" r="0.55">
      <stop offset="0" stop-color="#2f6fd0" stop-opacity="0.4"/>
      <stop offset="0.45" stop-color="#1b4d8c" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#06111b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ea043"/>
      <stop offset="0.55" stop-color="#5ad07a"/>
      <stop offset="1" stop-color="#d4b56a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3b6f9e" stroke-width="0.6" stroke-opacity="0.16"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <circle cx="957" cy="86" r="58" fill="#2f6fd0" fill-opacity="0.18" filter="url(#soft)"/>
  <circle cx="957" cy="86" r="25" fill="none" stroke="#7fb4ff" stroke-width="1.4" stroke-opacity="0.65"/>
  <circle cx="957" cy="86" r="6" fill="#d4b56a"/>
  <ellipse cx="957" cy="86" rx="122" ry="44" fill="none" stroke="#7fb4ff" stroke-width="1" stroke-opacity="0.28" transform="rotate(-18 957 86)"/>
  <ellipse cx="957" cy="86" rx="86" ry="86" fill="none" stroke="#2ea043" stroke-width="0.9" stroke-opacity="0.22"/>

  <g fill="#5ad07a">
    <circle cx="806" cy="52" r="2.5"/>
    <circle cx="855" cy="210" r="2"/>
    <circle cx="1092" cy="168" r="2.5"/>
    <circle cx="1036" cy="238" r="1.8"/>
  </g>
  <g fill="#d4b56a" fill-opacity="0.8">
    <circle cx="742" cy="132" r="1.6"/>
    <circle cx="1132" cy="66" r="1.6"/>
    <circle cx="889" cy="258" r="1.4"/>
  </g>
  <path d="M806 52 L855 210 L957 86 L1092 168 L1036 238" fill="none" stroke="#2ea043" stroke-width="1" stroke-opacity="0.22"/>

  <path d="M64 246 H1136" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.72"/>
  <rect x="64" y="60" width="4" height="154" fill="url(#accent)"/>

  <text x="92" y="112" fill="#7fb4ff" font-family="Segoe UI, Ubuntu, sans-serif" font-size="15" letter-spacing="3">IDENTIDAD TECNOLÓGICA MAKER INDEPENDIENTE</text>
  <text x="88" y="184" fill="#ffffff" font-family="Segoe UI, Ubuntu, sans-serif" font-size="62" font-weight="700" letter-spacing="7">QUASARPUNK</text>
  <text x="92" y="224" fill="#5ad07a" font-family="Segoe UI, Ubuntu, sans-serif" font-size="19" letter-spacing="3">DISEÑA. CONSTRUYE. COMPARTE.</text>
  <text x="92" y="278" fill="#9fb3c8" font-family="Segoe UI, Ubuntu, sans-serif" font-size="14" letter-spacing="2">VIEDMA  ·  RÍO NEGRO  ·  ARGENTINA</text>
  <text x="1136" y="278" text-anchor="end" fill="#d4b56a" font-family="Segoe UI, Ubuntu, sans-serif" font-size="12" letter-spacing="2">ROBOTICS  /  EMBEDDED  /  WEB</text>
</svg>
